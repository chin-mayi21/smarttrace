      let colorStyles = "bg-slate-100 text-slate-600 border-slate-200";
      let icon = null;
      if (["Compliant", "Verified & Locked", "Completed", "Active & Enforced", "Resolved"].includes(status)) {
        colorStyles = "bg-emerald-50 text-emerald-800 border-emerald-300 font-semibold"; icon = "✓";
      } else if (["Non-Compliant", "Violation Detected", "Critical", "Active Violation Detected"].includes(status)) {
        colorStyles = "bg-rose-50 text-rose-800 border-rose-300 font-semibold"; icon = "✕";
      } else if (["Warning", "Under Investigation", "Complaint Filed", "Complaint Lodged"].includes(status)) {
        colorStyles = "bg-amber-50 text-amber-800 border-amber-300"; icon = "!";
      }
      return (
        <span className={"inline-flex items-center gap-1.5 rounded-full border shadow-sm px-2.5 py-0.5 text-xs " + colorStyles}>
          {icon && <span className="font-bold">{icon}</span>}

                <div className="p-6 space-y-4 text-xs text-slate-700">
                  {escalationStage === 1 && (
                    <div className="space-y-3">
                      <div className="bg-rose-50 border border-rose-200 p-3.5 rounded-xl text-rose-900">
                        <p className="font-bold">Detected Offense:</p>
                        <p className="mt-1">Sale of <span className="font-semibold">{selectedProduct.name}</span> at <strong>Rs.185.00</strong> exceeding registered DPCR MRP of <strong>Rs.165.00</strong> (Violation of Rule 18(2)).</p>
                      </div>
                      <div><label className="block font-bold text-slate-800 mb-1">Notice Target Entities</label>
                        <input type="text" defaultValue="Vishal Mart (Retailer) and Kiran Traders (Wholesaler)" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs" /></div>
                      <div className="grid grid-cols-2 gap-3">
                        <div><label className="block font-bold text-slate-800 mb-1">Offense Category</label>
                          <input type="text" readOnly value="Section 36(1) - Overcharging" className="w-full p-2.5 bg-slate-100 border rounded-lg text-xs" /></div>
                        <div><label className="block font-bold text-slate-800 mb-1">Statutory Response SLA</label>
                          <input type="text" readOnly value="7 Working Days" className="w-full p-2.5 bg-slate-100 border rounded-lg text-xs" /></div>
                      </div>
                    </div>
                  )}
                  {escalationStage === 2 && (
                    <div className="space-y-3">
                      <div className="p-3.5 bg-amber-50 border border-amber-200 rounded-xl text-amber-950">
                        <p className="font-bold">Compounding of Offense under Section 48:</p>
                        <p className="mt-1">Offender may compound the first offense upon payment of prescribed compounding fee to the State Government without criminal court trial.</p>
                      </div>
                      <div><label className="block font-bold text-slate-800 mb-1">Proposed Compounding Fee (Rs.)</label>
                        <div className="flex items-center gap-2">
                          <input type="number" defaultValue="25000" className="flex-1 p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold" />
                          <span className="text-[11px] text-slate-500 bg-slate-100 px-3 py-2 rounded-lg">Ceiling: Rs.25,000 (1st Offense)</span>
                        </div>
                      </div>
                      <div className="bg-slate-50 p-3 rounded-lg border text-slate-600 text-[11px]">Non-payment within 15 days automatically triggers Stage 3 (Judicial Court Prosecution).</div>
                    </div>
                  )}
                  {escalationStage === 3 && (
                    <div className="space-y-3">
                      <div className="p-3.5 bg-rose-100 border border-rose-300 rounded-xl text-rose-950">
                        <p className="font-bold">Formal Court Prosecution and Seizure Order:</p>
                        <p className="mt-1">Filing complaint before Metropolitan Magistrate Court under Section 36(1). Penalty: Fine up to Rs.50,000 or imprisonment up to 1 year for repeat offenses.</p>
                      </div>
                      <div className="border p-3 rounded-xl bg-slate-50 space-y-1 text-[11px] text-slate-700">
                        <p><strong>Seizure Order:</strong> Confiscation of 184 remaining units on display at Vishal Mart.</p>
                        <p><strong>Witness Geotag:</strong> GPS coordinates and SHA-256 evidence submitted to Judicial Registrar.</p>
                      </div>
                    </div>
                  )}
                  <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-200">
                    <button onClick={function() { setNoticeModalOpen(false); }} className="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100 font-semibold">Cancel</button>
                    <button onClick={function() { setNoticeModalOpen(false); setNoticeSuccess(true); }} className="flex items-center gap-2 px-5 py-2 rounded-lg bg-rose-700 hover:bg-rose-600 text-white font-bold shadow-md">
                      {escalationStage === 1 ? "Issue Statutory e-Notice" : escalationStage === 2 ? "Issue Compounding Order" : "Submit Court Prosecution Complaint"}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {dossierModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/75 p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-4xl w-full my-6 overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between no-print">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white">S</div>
                    <div>
                      <div className="flex items-center gap-2">
                        <h3 className="font-bold text-sm">Forensic Evidence Dossier (Images, Data, Logs)</h3>
                        <span className="text-[10px] bg-emerald-800 text-emerald-200 font-mono px-2 py-0.5 rounded border border-emerald-700">COURT-ADMISSIBLE</span>
                      </div>
                      <p className="text-[11px] text-slate-400">Inspection ID: <span className="font-mono text-white">{selectedProduct.evidence.inspectionId}</span> - Certified Chain-of-Custody</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={handleDownloadJson} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold border border-slate-700">Download JSON</button>
                    <button onClick={function() { window.print(); }} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold">Print</button>
                    <button onClick={function() { setDossierModalOpen(false); }} className="p-1 rounded text-slate-400 hover:text-white">✕</button>
                  </div>
                </div>
                <div className="flex border-b bg-slate-50 px-6 pt-3 gap-2 text-xs font-bold no-print">
                  {[["dossier", "Evidentiary Summary"], ["rawLogs", "Raw OCR Bounding Logs"], ["forensicExif", "Terminal Geotag and EXIF"]].map(function(t) {
                    return (
                      <button key={t[0]} onClick={function() { setDossierTab(t[0]); }}
                        className={"pb-3 px-3 border-b-2 transition-all " + (dossierTab === t[0] ? "border-emerald-600 text-emerald-800" : "border-transparent text-slate-500 hover:text-slate-800")}>
                        {t[1]}
                      </button>
                    );
                  })}
                </div>
                <div className="p-6 overflow-y-auto space-y-5 text-xs text-slate-800 printable-area flex-1">
                  {dossierTab === "dossier" && (
                    <div className="space-y-4">
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div><span className="text-[10px] text-slate-400 uppercase font-bold block">Specimen SKU</span><p className="font-bold text-slate-900">{selectedProduct.name}</p></div>
                        <div><span className="text-[10px] text-slate-400 uppercase font-bold block">Batch Number</span><p className="font-mono font-bold text-emerald-700">{selectedProduct.batch.number}</p></div>
                        <div><span className="text-[10px] text-slate-400 uppercase font-bold block">Retail Premise</span><p className="font-semibold text-slate-800">{selectedProduct.evidence.location.split(",")[0]}</p></div>
                        <div><span className="text-[10px] text-slate-400 uppercase font-bold block">Enforcement Officer</span><p className="font-semibold text-slate-800">{selectedProduct.evidence.inspector}</p></div>
                      </div>
                      <div className="p-4 rounded-xl border border-rose-200 bg-rose-50/70 text-rose-950 space-y-1.5">
                        <h4 className="font-bold text-sm text-rose-900">Statutory Offense Classification: Section 36(1) — Sale Above Declared MRP</h4>
                        <p className="leading-relaxed">Optical measurement confirmed retail pack sticker price of <strong>Rs.{selectedProduct.currentPhysicalScan.detectedMrp.toFixed(2)}</strong> exceeds legally registered DPCR MRP of <strong>Rs.{selectedProduct.dpcr.mrp.toFixed(2)}</strong> by Rs.20.00 (+12.1%).</p>
                        <div className="pt-2 flex items-center justify-between text-[11px] font-mono text-slate-600 border-t border-rose-200">
                          <span>Permissible Price Tolerance: 0.0% (Strict Price Ceiling)</span>
                          <span className="text-rose-700 font-bold">Severity: Critical Violation</span>
                        </div>
                      </div>
                      <div className="bg-slate-900 text-slate-300 p-4 rounded-xl space-y-2 font-mono text-[11px]">
                        <div className="flex justify-between font-bold text-emerald-400"><span>FORENSIC DIGITAL FINGERPRINT</span><span>IMMUTABLE SEAL</span></div>
                        <p className="break-all bg-slate-950 p-2.5 rounded border border-slate-800 text-emerald-300 text-[10px]">SHA-256: {selectedProduct.evidence.sha256Hash}</p>
                        <div className="flex justify-between text-[10px] text-slate-400">
                          <span>Digital Key: {selectedProduct.evidence.digitalSignature.substring(0, 32)}...</span>
                          <span>Time-Sync: NTP National Physics Laboratory</span>
                        </div>
                      </div>
                    </div>
                  )}
                  {dossierTab === "rawLogs" && (
                    <div className="space-y-3">
                      <table className="w-full text-left border rounded-xl overflow-hidden font-mono text-[11px]">
                        <thead className="bg-slate-100 text-slate-600 font-bold uppercase text-[10px]">
                          <tr><th className="p-2.5">Field Token</th><th className="p-2.5">Extracted String</th><th className="p-2.5">Bounding Box (px)</th><th className="p-2.5">Confidence</th><th className="p-2.5">Rule Verdict</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {ocrBoundingBoxLog.map(function(log, i) {
                            return (
                              <tr key={i} className={log.status === "VIOLATION" ? "bg-rose-50" : "hover:bg-slate-50"}>
                                <td className="p-2.5 font-bold text-slate-800">{log.field}</td>
                                <td className="p-2.5 text-slate-900 font-bold">{log.detectedText}</td>
                                <td className="p-2.5 text-slate-500">{log.bbox}</td>
                                <td className="p-2.5 text-emerald-700 font-bold">{log.confidence}</td>
                                <td className="p-2.5"><span className={"px-1.5 py-0.5 rounded text-[10px] font-bold " + (log.status === "VIOLATION" ? "bg-rose-100 text-rose-800 border border-rose-200" : "bg-emerald-100 text-emerald-800")}>{log.status}</span></td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                  {dossierTab === "forensicExif" && (
                    <div className="space-y-3 text-xs">
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2 font-mono">
                        <p className="font-bold text-slate-900 text-sm mb-2">Inspector Hardware Telemetry and Geolocation:</p>
                        <div className="grid grid-cols-2 gap-3 text-[11px] text-slate-700">
                          <div>Terminal Model: <strong className="text-slate-900">{selectedProduct.evidence.deviceId}</strong></div>
                          <div>GPS Coordinates: <strong className="text-slate-900">{selectedProduct.evidence.coordinates}</strong></div>
                          <div>Optical Sensor: <strong>Sony IMX766 (12.2MP f/1.8)</strong></div>
                          <div>Timestamp: <strong>{selectedProduct.evidence.timestamp}</strong></div>
                          <div>Officer Badge: <strong>{selectedProduct.evidence.inspectorBadge}</strong></div>
                        </div>
                      </div>
                      <div className="p-3 bg-blue-50 border border-blue-200 rounded-xl text-blue-900 text-[11px] leading-relaxed">
                        <strong>Legal Admissibility Note:</strong> Under Section 65B of the Indian Evidence Act, this electronic dossier is accompanied by device hash certificates confirming data was recorded directly without intermediary manual alteration.
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {rulesModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-4xl w-full my-6 overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white text-sm">📖</div>
                    <div>
                      <h3 className="font-bold text-sm">Legal Metrology Master Data and Statutory Rules Library</h3>
                      <p className="text-[11px] text-slate-400">Legal Metrology (Packaged Commodities) Rules 2011 - Official Reference</p>
                    </div>
                  </div>
                  <button onClick={function() { setRulesModalOpen(false); }} className="p-1.5 rounded-lg text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="flex border-b border-slate-200 bg-slate-50 px-6 pt-3 gap-2 overflow-x-auto text-xs font-bold">
                  {[["rule6", "Rule 6: Mandatory Declarations"], ["tolerances", "Schedule II: MPE Error Limits"], ["font", "Rule 9: Font Height Standards"], ["gazette", "Gazette Notifications"]].map(function(t) {
                    return (
                      <button key={t[0]} onClick={function() { setRulesTab(t[0]); }}
                        className={"pb-3 px-3 border-b-2 transition-all whitespace-nowrap " + (rulesTab === t[0] ? "border-emerald-600 text-emerald-800" : "border-transparent text-slate-500 hover:text-slate-800")}>
                        {t[1]}
                      </button>
                    );
                  })}
                </div>
                <div className="p-6 overflow-y-auto space-y-4 text-xs text-slate-800 flex-1">
                  {rulesTab === "rule6" && (
                    <div className="divide-y divide-slate-100 border rounded-xl overflow-hidden">
                      {mockMasterRules.mandatoryDeclarationsRule6.map(function(d, i) {
                        return (
                          <div key={i} className="p-3.5 bg-white hover:bg-slate-50 flex items-start justify-between gap-4">
                            <div className="space-y-0.5">
                              <div className="flex items-center gap-2">
                                <span className="font-mono text-[10px] font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded">{d.rule}</span>
                                <h4 className="font-bold text-slate-900">{d.title}</h4>
                              </div>
                              <p className="text-[11px] text-slate-600 mt-1">{d.detail}</p>
                            </div>
                            <span className="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded border border-emerald-300 shrink-0">{d.status}</span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                  {rulesTab === "tolerances" && (
                    <table className="w-full text-left border rounded-xl overflow-hidden">
                      <thead className="bg-slate-100 text-slate-600 font-bold uppercase text-[10px]">
                        <tr><th className="p-3">Quantity Declared Range</th><th className="p-3">Max Error %</th><th className="p-3">Max Absolute Error</th><th className="p-3">Notes</th></tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {mockMasterRules.scheduleIITolerances.map(function(t, i) {
                          return (
                            <tr key={i} className="hover:bg-slate-50"><td className="p-3 font-bold text-slate-900">{t.range}</td><td className="p-3 font-mono text-emerald-700 font-semibold">{t.maxErrorPercent}</td><td className="p-3 font-mono text-slate-800 font-bold">{t.maxAbsoluteError}</td><td className="p-3 text-slate-500">{t.notes}</td></tr>
                          );
                        })}
                      </tbody>
                    </table>
                  )}
                  {rulesTab === "font" && (
                    <table className="w-full text-left border rounded-xl overflow-hidden">
                      <thead className="bg-slate-100 text-slate-600 font-bold uppercase text-[10px]">
                        <tr><th className="p-3">Principal Display Area (PDA)</th><th className="p-3">Min Letter Height</th><th className="p-3">Min Numeral Height</th></tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {mockMasterRules.rule9FontHeights.map(function(f, i) {
                          return (
                            <tr key={i} className="hover:bg-slate-50"><td className="p-3 font-semibold text-slate-900">{f.pdaArea}</td><td className="p-3 font-mono font-bold text-blue-700">{f.minFontHeightMm}</td><td className="p-3 font-mono font-bold text-emerald-700">{f.numeralHeightMm}</td></tr>
                          );
                        })}
                      </tbody>
                    </table>
                  )}
                  {rulesTab === "gazette" && (
                    <div className="space-y-3">
                      {mockMasterRules.gazetteNotifications.map(function(g, i) {
                        return (
                          <div key={i} className="p-3.5 rounded-xl border border-slate-200 bg-white space-y-1">
                            <div className="flex justify-between items-center">
                              <span className="font-mono font-bold text-emerald-800 text-xs">{g.id}</span>
                              <span className="text-[10px] text-slate-400">{g.date}</span>
                            </div>
                            <p className="font-bold text-slate-900">{g.subject}</p>
                            <span className="inline-block text-[10px] text-emerald-700 font-semibold bg-emerald-50 px-2 py-0.5 rounded">{g.status}</span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
                <div className="p-4 bg-slate-50 border-t border-slate-200 flex justify-end">
                  <button onClick={function() { setRulesModalOpen(false); }} className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl">Close Master Library</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // ============================================================
    // ROOT APP — ROLE ROUTER
    // ============================================================
    function App() {
      const [activeRole, setActiveRole] = useState("official");

      return (
        <div key={activeRole} className="role-transition">
          {activeRole === "consumer" && <ConsumerApp onRoleChange={setActiveRole} />}
          {activeRole === "business" && <BusinessApp onRoleChange={setActiveRole} />}
          {activeRole === "official" && <OfficialApp onRoleChange={setActiveRole} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
